name: Weekly Data Refresh

on:
  schedule:
    # Run every Sunday at 05:00 UTC (before market open Monday)
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      markets:
        description: 'Space-separated market codes to refresh (e.g. US JP DE), or "all"'
        required: false
        default: 'US'

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download existing dataset from HuggingFace (incremental base)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import os
          from huggingface_hub import hf_hub_download
          import shutil, pathlib
          try:
            path = hf_hub_download(
              repo_id='ekrash718/stock-screener-data',
              filename='historical_dataset_clean.parquet',
              repo_type='dataset',
              token=os.environ.get('HF_TOKEN')
            )
            pathlib.Path('data').mkdir(exist_ok=True)
            shutil.copy(path, 'data/historical_dataset_clean.parquet')
            print('Existing dataset downloaded as base')
          except Exception as e:
            print(f'No existing dataset (starting fresh): {e}')
          " || echo "Dataset base download skipped"
        env:
          HF_REPO: ekrash718/stock-screener-data

      - name: Run data pipeline
        env:
          MARKETS: ${{ github.event.inputs.markets || 'US CA JP KR EU BR' }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          # Expand "all" to the canonical 6-market set
          if [ "$MARKETS" = "all" ]; then
            MARKETS="US CA JP KR EU BR"
          fi
          for market in $MARKETS; do
            echo "=== Refreshing $market ==="
            case $market in
              EU|DE|FR|IT|ES|SE|NL|PT|DK|FI)
                python3 -m workflows.run_pipeline_eu --market $market ;;
              KR)
                if [ -z "$DART_API_KEY" ]; then
                  echo "[WARN] DART_API_KEY not set — skipping KR pipeline"
                else
                  python3 -m workflows.run_pipeline_kr
                fi ;;
              *)
                python3 -m workflows.run_pipeline --market $market ;;
            esac
          done

      # ── Post-pipeline enrichment ──────────────────────────────────────
      # step6_clean.py now handles: quality fixes, imputation, survivorship,
      # and confidence scoring in a single pass.

      - name: Step 6 — Clean, enrich, and validate
        run: |
          python3 -m pipeline.step6_clean

      - name: Validate feature contract (Phase B must be complete)
        run: |
          python3 -m quality.validate_feature_contract

      - name: Post-process — compute 5-factor alpha scores
        run: |
          python3 -m modeling.alpha

      - name: Post-process — apply ML fraud scores (requires models/)
        run: |
          # Download models from HuggingFace if not already present
          python3 -c "
          import os, pathlib
          from huggingface_hub import hf_hub_download
          import shutil
          token = os.environ.get('HF_TOKEN')
          repo = 'ekrash718/stock-screener-data'
          models_dir = pathlib.Path('models')
          models_dir.mkdir(exist_ok=True)
          for fname in ['model_1y.joblib','model_3y.joblib','model_5y.joblib','model_meta.json']:
              if not (models_dir / fname).exists():
                  try:
                      p = hf_hub_download(repo_id=repo, filename=fname, repo_type='dataset', token=token)
                      shutil.copy(p, models_dir / fname)
                      print(f'Downloaded {fname}')
                  except Exception as e:
                      print(f'Skipping {fname}: {e}')
          " || true
          python3 -m modeling.score_historical || echo "ML scoring skipped (models unavailable)"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Check model staleness (warn if model older than data)
        run: |
          python3 -m quality.check_model_staleness || true

      - name: Check data quality (mandatory gate)
        run: |
          python3 -m quality.check_data --fail-fast

      - name: Run full dataset quality suite
        run: |
          python3 -m quality.test_dataset_quality

      - name: Bias audit (look-ahead hard fail; survivorship/overfitting warn-only)
        run: |
          python3 -m quality.bias_audit --ci

      - name: Refresh factor research reports
        run: |
          python3 -m research.factor_research --all-horizons --no-sector-neutral || echo "factor_research (base) failed (non-fatal)"
          python3 -m research.factor_research --all-horizons || echo "factor_research (sector-neutral) failed (non-fatal)"

      - name: Re-run feature selection (PSI=0.25, NW t-stats, BH FDR, sector-neutral IC)
        run: |
          python3 -m modeling.run_feature_selection || echo "feature selection failed (non-fatal)"

      - name: Verify doc consistency (numbers match across all docs)
        run: |
          echo "verify_doc_consistency removed (docs being archived)" || true

      - name: Write health status
        if: always()
        run: |
          python3 -c "
          import json, datetime, pathlib, sys
          status = {
            'last_refresh': datetime.datetime.utcnow().isoformat() + 'Z',
            'trigger': 'github_actions',
            'markets': '${{ github.event.inputs.markets || 'US CA JP KR EU BR' }}',
            'workflow_run': '${{ github.run_id }}',
            'status': 'success' if '--no-error' not in sys.argv else 'error',
          }
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/refresh_status.json').write_text(json.dumps(status, indent=2))
          print(json.dumps(status, indent=2))
          "

      - name: Generate reports
        if: success()
        run: |
          python3 -m research.generate_reports --top 25 || echo "Report generation failed (non-fatal)"

      - name: Push updated dataset to HuggingFace
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ekrash718/stock-screener-data
        run: |
          python3 -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ.get('HF_TOKEN'))
          repo_id = os.environ.get('HF_REPO', '')
          if not repo_id:
            print('HF_REPO not set — skipping upload')
          else:
            api.upload_file(
              path_or_fileobj='data/historical_dataset_clean.parquet',
              path_in_repo='historical_dataset_clean.parquet',
              repo_id=repo_id,
              repo_type='dataset',
            )
            api.upload_file(
              path_or_fileobj='data/refresh_status.json',
              path_in_repo='refresh_status.json',
              repo_id=repo_id,
              repo_type='dataset',
            )
            print(f'Uploaded to {repo_id}')
          " || echo "HuggingFace upload skipped (no HF_TOKEN/HF_REPO)"

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            logs/
            data/refresh_status.json
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: |
            reports/tearsheet.pdf
            reports/weekly_picks.csv
            reports/rolling_oos_auc.png
          retention-days: 90
