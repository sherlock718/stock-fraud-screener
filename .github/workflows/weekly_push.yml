name: Weekly Data Push to HuggingFace

# Runs every Sunday at 02:00 UTC, or manually via workflow_dispatch.
# Requires this GitHub Actions secret:
#   HF_TOKEN  — HuggingFace write token (repo: ekrash718/stock-screener-data)

on:
  schedule:
    - cron: '0 2 * * 0'   # Sunday 02:00 UTC
  workflow_dispatch:        # manual trigger

jobs:
  push-to-hf:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest data from HF (to check if re-push is needed)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO:  ekrash718/stock-screener-data
        run: |
          python3 -c "
          import os
          from huggingface_hub import hf_hub_download
          repo = 'ekrash718/stock-screener-data'
          token = os.environ['HF_TOKEN']
          try:
              p = hf_hub_download(repo_id=repo, filename='historical_dataset_clean.parquet',
                                  repo_type='dataset', token=token,
                                  local_dir='data', local_dir_use_symlinks=False)
              print(f'Downloaded existing dataset to {p}')
          except Exception as e:
              print(f'No existing dataset (first push): {e}')
          "

      - name: Run features + clean (quick mode — no new API calls)
        run: python3 scripts/run_pipeline.py build --step 4

      - name: Push dataset and models to HuggingFace Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/push_to_hf.py \
            --repo "ekrash718/stock-screener-data" \
            --message "Weekly auto-update $(date -u +%Y-%m-%d)"

      - name: Summary
        run: |
          echo "Push complete. Dataset size:"
          ls -lh data/historical_dataset_clean.parquet || echo "file not found"
          ls -lh models/*.joblib 2>/dev/null || echo "no joblib models found"
