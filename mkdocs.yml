site_name: Stock Fraud Screener
site_description: Multi-market accounting fraud detection using ML — US, EU, Korea, Japan, Canada, Brazil
site_author: Mhoque
repo_url: https://github.com/sherlock718/stock-fraud-screener
repo_name: stock-fraud-screener
edit_uri: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Architecture: architecture.md
  - Markets & Data: markets.md
  - User Guide:
    - guide/index.md
    - App Walkthrough: guide/app.md
    - Score Interpretation: guide/scores.md
    - Strategies: guide/strategies.md
  - Methodology:
    - methodology/index.md
    - Data Pipeline: methodology/pipeline.md
    - Feature Engineering: methodology/features.md
    - ML Models: methodology/models.md
    - Backtesting: methodology/backtesting.md
    - Factor Research: methodology/factor-research.md
    - Bias & Validation: methodology/bias-validation.md
    - Leverage Strategy: methodology/leverage.md
  - Developer Guide:
    - developer/index.md
    - Setup: developer/setup.md
    - Deployment: developer/deployment.md
    - Scripts Reference: developer/scripts.md
    - Monitoring: developer/monitoring.md
    - Tests: developer/tests.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mhoque/stock-fraud-screener
